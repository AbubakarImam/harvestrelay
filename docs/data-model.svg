<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1060" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1700" height="1060" fill="#ffffff"/>

  <!-- Banner -->
  <rect x="0" y="0" width="1700" height="56" fill="#8a1f11"/>
  <text x="850" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">
    CONCEPT / IDEA-STAGE DESIGN — NOT A BUILT OR DEPLOYED SYSTEM
  </text>

  <text x="850" y="92" text-anchor="middle" font-size="30" font-weight="bold" fill="#1b3a4b">HarvestRelay — Data Model (ER Diagram)</text>
  <text x="850" y="120" text-anchor="middle" font-size="18" font-style="italic" fill="#555555">Entities, key fields, and relationships for the proposed design. Field lists are illustrative, not a final schema.</text>

  <defs>
    <marker id="dm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b3a4b"/>
    </marker>
  </defs>

  <!-- ============ FARMER ============ -->
  <g>
    <rect x="60" y="150" width="300" height="220" rx="10" fill="#eaf4ea" stroke="#2f7a3d" stroke-width="3"/>
    <rect x="60" y="150" width="300" height="40" rx="10" fill="#2f7a3d"/>
    <rect x="60" y="170" width="300" height="20" fill="#2f7a3d"/>
    <text x="210" y="177" text-anchor="middle" font-size="19" font-weight="bold" fill="#ffffff">FARMER</text>
    <text x="78" y="216" font-size="16" fill="#1b3a1f">farmer_id (PK)</text>
    <text x="78" y="242" font-size="16" fill="#1b3a1f">name</text>
    <text x="78" y="268" font-size="16" fill="#1b3a1f">phone_number</text>
    <text x="78" y="294" font-size="16" fill="#1b3a1f">village_cluster</text>
    <text x="78" y="320" font-size="16" fill="#1b3a1f">preferred_language</text>
    <text x="78" y="346" font-size="16" fill="#1b3a1f">consent_given_at</text>
  </g>

  <!-- ============ AGENT ============ -->
  <g>
    <rect x="700" y="150" width="320" height="190" rx="10" fill="#eef2fb" stroke="#2a4a9e" stroke-width="3"/>
    <rect x="700" y="150" width="320" height="40" rx="10" fill="#2a4a9e"/>
    <rect x="700" y="170" width="320" height="20" fill="#2a4a9e"/>
    <text x="860" y="177" text-anchor="middle" font-size="19" font-weight="bold" fill="#ffffff">AGENT</text>
    <text x="718" y="216" font-size="16" fill="#13255c">agent_id (PK)</text>
    <text x="718" y="242" font-size="16" fill="#13255c">name</text>
    <text x="718" y="268" font-size="16" fill="#13255c">phone_number</text>
    <text x="718" y="294" font-size="16" fill="#13255c">village_clusters_managed</text>
    <text x="718" y="320" font-size="16" fill="#13255c">role = "agent"</text>
  </g>

  <!-- ============ PROVIDER ============ -->
  <g>
    <rect x="1340" y="150" width="300" height="220" rx="10" fill="#fff4e0" stroke="#a66a00" stroke-width="3"/>
    <rect x="1340" y="150" width="300" height="40" rx="10" fill="#a66a00"/>
    <rect x="1340" y="170" width="300" height="20" fill="#a66a00"/>
    <text x="1490" y="177" text-anchor="middle" font-size="19" font-weight="bold" fill="#ffffff">PROVIDER</text>
    <text x="1358" y="216" font-size="16" fill="#6b4700">provider_id (PK)</text>
    <text x="1358" y="242" font-size="16" fill="#6b4700">name</text>
    <text x="1358" y="268" font-size="16" fill="#6b4700">phone_number</text>
    <text x="1358" y="294" font-size="16" fill="#6b4700">service_type (truck / cold room)</text>
    <text x="1358" y="320" font-size="16" fill="#6b4700">capacity (crates)</text>
    <text x="1358" y="346" font-size="16" fill="#6b4700">service_area</text>
  </g>

  <!-- ============ REQUEST ============ -->
  <g>
    <rect x="60" y="440" width="300" height="230" rx="10" fill="#eaf4ea" stroke="#2f7a3d" stroke-width="3"/>
    <rect x="60" y="440" width="300" height="40" rx="10" fill="#2f7a3d"/>
    <rect x="60" y="460" width="300" height="20" fill="#2f7a3d"/>
    <text x="210" y="467" text-anchor="middle" font-size="19" font-weight="bold" fill="#ffffff">REQUEST</text>
    <text x="78" y="506" font-size="16" fill="#1b3a1f">request_id (PK)</text>
    <text x="78" y="532" font-size="16" fill="#1b3a1f">farmer_id (FK)</text>
    <text x="78" y="558" font-size="16" fill="#1b3a1f">crop</text>
    <text x="78" y="584" font-size="16" fill="#1b3a1f">crate_count</text>
    <text x="78" y="610" font-size="16" fill="#1b3a1f">harvest_week</text>
    <text x="78" y="636" font-size="16" fill="#1b3a1f">service_type (truck / cold room)</text>
    <text x="78" y="658" font-size="15" fill="#1b3a1f">status, pool_id (FK)</text>
  </g>

  <!-- ============ POOL ============ -->
  <g>
    <rect x="680" y="410" width="340" height="270" rx="10" fill="#eee7fb" stroke="#5b2fa0" stroke-width="3"/>
    <rect x="680" y="410" width="340" height="40" rx="10" fill="#5b2fa0"/>
    <rect x="680" y="430" width="340" height="20" fill="#5b2fa0"/>
    <text x="850" y="437" text-anchor="middle" font-size="19" font-weight="bold" fill="#ffffff">POOL</text>
    <text x="698" y="476" font-size="16" fill="#38205e">pool_id (PK)</text>
    <text x="698" y="502" font-size="16" fill="#38205e">village_cluster</text>
    <text x="698" y="528" font-size="16" fill="#38205e">crop</text>
    <text x="698" y="554" font-size="16" fill="#38205e">harvest_week</text>
    <text x="698" y="580" font-size="16" fill="#38205e">service_type (truck / cold room)</text>
    <text x="698" y="606" font-size="16" fill="#38205e">total_crates_so_far</text>
    <text x="698" y="632" font-size="16" fill="#38205e">fill_threshold (sample value)</text>
    <text x="698" y="658" font-size="16" fill="#38205e">status (open / filled / expired)</text>
  </g>

  <!-- ============ QUOTE ============ -->
  <g>
    <rect x="1340" y="440" width="300" height="210" rx="10" fill="#fff4e0" stroke="#a66a00" stroke-width="3"/>
    <rect x="1340" y="440" width="300" height="40" rx="10" fill="#a66a00"/>
    <rect x="1340" y="460" width="300" height="20" fill="#a66a00"/>
    <text x="1490" y="467" text-anchor="middle" font-size="19" font-weight="bold" fill="#ffffff">QUOTE</text>
    <text x="1358" y="506" font-size="16" fill="#6b4700">quote_id (PK)</text>
    <text x="1358" y="532" font-size="16" fill="#6b4700">pool_id (FK)</text>
    <text x="1358" y="558" font-size="16" fill="#6b4700">provider_id (FK)</text>
    <text x="1358" y="584" font-size="16" fill="#6b4700">price_quoted</text>
    <text x="1358" y="610" font-size="16" fill="#6b4700">pickup_day</text>
    <text x="1358" y="636" font-size="15" fill="#6b4700">status (submitted/accepted/declined)</text>
  </g>

  <!-- ============ RECEIPT ============ -->
  <g>
    <rect x="60" y="770" width="300" height="200" rx="10" fill="#fdeaea" stroke="#a02424" stroke-width="3"/>
    <rect x="60" y="770" width="300" height="40" rx="10" fill="#a02424"/>
    <rect x="60" y="790" width="300" height="20" fill="#a02424"/>
    <text x="210" y="797" text-anchor="middle" font-size="19" font-weight="bold" fill="#ffffff">RECEIPT</text>
    <text x="78" y="836" font-size="16" fill="#6e1414">receipt_id (PK)</text>
    <text x="78" y="862" font-size="16" fill="#6e1414">booking_id (FK)</text>
    <text x="78" y="888" font-size="16" fill="#6e1414">farmer_id (FK)</text>
    <text x="78" y="914" font-size="16" fill="#6e1414">crates_collected</text>
    <text x="78" y="940" font-size="16" fill="#6e1414">cost_share, issued_at</text>
  </g>

  <!-- ============ BOOKING ============ -->
  <g>
    <rect x="680" y="770" width="340" height="200" rx="10" fill="#eee7fb" stroke="#5b2fa0" stroke-width="3"/>
    <rect x="680" y="770" width="340" height="40" rx="10" fill="#5b2fa0"/>
    <rect x="680" y="790" width="340" height="20" fill="#5b2fa0"/>
    <text x="850" y="797" text-anchor="middle" font-size="19" font-weight="bold" fill="#ffffff">BOOKING</text>
    <text x="698" y="836" font-size="16" fill="#38205e">booking_id (PK)</text>
    <text x="698" y="862" font-size="16" fill="#38205e">pool_id (FK), quote_id (FK)</text>
    <text x="698" y="888" font-size="16" fill="#38205e">accepted_by_agent_id (FK)</text>
    <text x="698" y="914" font-size="16" fill="#38205e">status, confirmed_at</text>
  </g>

  <!-- ============ RELATIONSHIPS ============ -->

  <!-- Farmer -> Request -->
  <line x1="210" y1="370" x2="210" y2="438" stroke="#1b3a4b" stroke-width="2.5" marker-end="url(#dm-arrow)"/>
  <text x="222" y="408" font-size="15" fill="#1b3a4b">1 — N</text>
  <text x="222" y="426" font-size="15" fill="#1b3a4b">submits</text>

  <!-- Request -> Pool -->
  <line x1="360" y1="555" x2="678" y2="545" stroke="#1b3a4b" stroke-width="2.5" marker-end="url(#dm-arrow)"/>
  <text x="400" y="540" font-size="15" fill="#1b3a4b">N — 1  grouped into</text>

  <!-- Provider -> Quote -->
  <line x1="1490" y1="370" x2="1490" y2="438" stroke="#1b3a4b" stroke-width="2.5" marker-end="url(#dm-arrow)"/>
  <text x="1398" y="408" font-size="15" fill="#1b3a4b">1 — N</text>
  <text x="1398" y="426" font-size="15" fill="#1b3a4b">submits</text>

  <!-- Quote -> Pool -->
  <line x1="1340" y1="565" x2="1022" y2="555" stroke="#1b3a4b" stroke-width="2.5" marker-end="url(#dm-arrow)"/>
  <text x="1120" y="590" font-size="15" fill="#1b3a4b">N — 1  invited for</text>

  <!-- Pool -> Booking -->
  <line x1="850" y1="682" x2="850" y2="768" stroke="#1b3a4b" stroke-width="2.5" marker-end="url(#dm-arrow)"/>
  <text x="862" y="715" font-size="15" fill="#1b3a4b">1 — 1</text>
  <text x="862" y="733" font-size="15" fill="#1b3a4b">becomes (once a</text>
  <text x="862" y="751" font-size="15" fill="#1b3a4b">quote is accepted)</text>

  <!-- Quote -> Booking -->
  <line x1="1400" y1="652" x2="1022" y2="808" stroke="#1b3a4b" stroke-width="2.5" marker-end="url(#dm-arrow)"/>
  <text x="1130" y="700" font-size="15" fill="#1b3a4b">1 — 1  accepted as</text>

  <!-- Agent -> Booking (routed down the left side of Pool) -->
  <path d="M 790 340 L 790 385 L 660 385 L 660 870 L 678 870" fill="none" stroke="#1b3a4b" stroke-width="2.5" marker-end="url(#dm-arrow)"/>
  <text x="430" y="380" font-size="15" fill="#1b3a4b">1 — N   accepts a quote on behalf of a pool</text>

  <!-- Booking -> Receipt -->
  <line x1="678" y1="880" x2="362" y2="870" stroke="#1b3a4b" stroke-width="2.5" marker-end="url(#dm-arrow)"/>
  <text x="420" y="862" font-size="15" fill="#1b3a4b">1 — N  generates</text>

  <!-- Farmer -> Receipt (routed down far left margin) -->
  <path d="M 70 370 L 30 370 L 30 840 L 58 840" fill="none" stroke="#1b3a4b" stroke-width="2.5" marker-end="url(#dm-arrow)"/>
  <text x="2" y="610" font-size="14" fill="#1b3a4b" transform="rotate(-90 20 610)">1 — N  receives</text>

  <!-- Legend -->
  <rect x="60" y="1000" width="1580" height="50" rx="8" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/>
  <text x="80" y="1030" font-size="16" fill="#333333">PK = primary key, FK = foreign key. "1 — N" / "N — 1" / "1 — 1" labels show relationship cardinality. Field lists are illustrative, not a final schema.</text>
</svg>
