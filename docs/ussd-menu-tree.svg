<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 2000" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1700" height="2000" fill="#ffffff"/>

  <!-- Banner -->
  <rect x="0" y="0" width="1700" height="56" fill="#8a1f11"/>
  <text x="850" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">
    CONCEPT / IDEA-STAGE DESIGN — NOT A BUILT OR DEPLOYED SYSTEM
  </text>
  <text x="850" y="92" text-anchor="middle" font-size="30" font-weight="bold" fill="#1b3a4b">HarvestRelay — USSD Menu Tree</text>
  <text x="850" y="120" text-anchor="middle" font-size="18" font-style="italic" fill="#555555">Sample dial code and menu wording — illustrative for this concept, not finalized copy.</text>

  <defs>
    <marker id="u-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b3a4b"/>
    </marker>
  </defs>

  <!-- DIAL -->
  <rect x="570" y="150" width="560" height="100" rx="10" fill="#e7f0fb" stroke="#1d5a9e" stroke-width="3"/>
  <text x="850" y="186" text-anchor="middle" font-size="19" font-weight="bold" fill="#123a63">Farmer or Agent dials USSD code</text>
  <text x="850" y="214" text-anchor="middle" font-size="16" fill="#123a63">Sample code: *384*1#  (illustrative only)</text>

  <line x1="850" y1="250" x2="850" y2="288" stroke="#1b3a4b" stroke-width="2.5" marker-end="url(#u-arrow)"/>

  <!-- LANGUAGE -->
  <rect x="570" y="290" width="560" height="140" rx="10" fill="#eaf4ea" stroke="#2f7a3d" stroke-width="3"/>
  <text x="850" y="318" text-anchor="middle" font-size="19" font-weight="bold" fill="#1b3a1f">Choose Language</text>
  <text x="850" y="346" text-anchor="middle" font-size="16" fill="#1b3a1f">1. English   2. Hausa   3. Yoruba   4. Igbo</text>
  <text x="850" y="372" text-anchor="middle" font-size="15" fill="#1b3a1f">(sample list — actual languages set per deployment area)</text>
  <text x="850" y="398" text-anchor="middle" font-size="15" fill="#1b3a1f">First-time use also shows a short consent message here</text>

  <line x1="850" y1="430" x2="850" y2="468" stroke="#1b3a4b" stroke-width="2.5" marker-end="url(#u-arrow)"/>

  <!-- MAIN MENU -->
  <rect x="540" y="470" width="620" height="220" rx="10" fill="#fff4e0" stroke="#a66a00" stroke-width="3"/>
  <text x="850" y="500" text-anchor="middle" font-size="19" font-weight="bold" fill="#6b4700">Main Menu</text>
  <text x="850" y="530" text-anchor="middle" font-size="16" fill="#6b4700">1. Join a Pool (truck or cold room)</text>
  <text x="850" y="558" text-anchor="middle" font-size="16" fill="#6b4700">2. Check My Pool Status</text>
  <text x="850" y="586" text-anchor="middle" font-size="16" fill="#6b4700">3. Confirm Pickup / View Last Receipt</text>
  <text x="850" y="614" text-anchor="middle" font-size="16" fill="#6b4700">4. Help</text>
  <text x="850" y="646" text-anchor="middle" font-size="15" fill="#6b4700">0. Exit</text>
  <text x="850" y="670" text-anchor="middle" font-size="14" fill="#6b4700" font-style="italic">(sample wording)</text>

  <!-- Main menu -> Crop (primary flow, option 1) -->
  <line x1="850" y1="690" x2="850" y2="728" stroke="#1b3a4b" stroke-width="2.5" marker-end="url(#u-arrow)"/>
  <text x="862" y="716" font-size="15" fill="#1b3a4b">if "1"</text>

  <!-- Main menu -> right leaves (options 2,3,4) -->
  <line x1="1160" y1="540" x2="1300" y2="540" stroke="#1b3a4b" stroke-width="2.5" marker-end="url(#u-arrow)"/>
  <text x="1170" y="530" font-size="14" fill="#1b3a4b">if "2"</text>
  <line x1="1160" y1="586" x2="1300" y2="670" stroke="#1b3a4b" stroke-width="2.5" marker-end="url(#u-arrow)"/>
  <text x="1170" y="615" font-size="14" fill="#1b3a4b">if "3"</text>
  <line x1="1160" y1="614" x2="1300" y2="800" stroke="#1b3a4b" stroke-width="2.5" marker-end="url(#u-arrow)"/>
  <text x="1170" y="680" font-size="14" fill="#1b3a4b">if "4"</text>

  <!-- Leaf: Check Pool Status -->
  <rect x="1300" y="490" width="340" height="100" rx="10" fill="#e9f7f5" stroke="#157a6e" stroke-width="3"/>
  <text x="1470" y="520" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d4a42">Pool Status shown:</text>
  <text x="1470" y="546" text-anchor="middle" font-size="15" fill="#0d4a42">"Your pool: 140/200 crates.</text>
  <text x="1470" y="568" text-anchor="middle" font-size="15" fill="#0d4a42">Still open." (sample)</text>

  <!-- Leaf: Receipt -->
  <rect x="1300" y="620" width="340" height="100" rx="10" fill="#e9f7f5" stroke="#157a6e" stroke-width="3"/>
  <text x="1470" y="650" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d4a42">Last Receipt shown:</text>
  <text x="1470" y="676" text-anchor="middle" font-size="15" fill="#0d4a42">crates collected, amount</text>
  <text x="1470" y="698" text-anchor="middle" font-size="15" fill="#0d4a42">owed / paid (sample)</text>

  <!-- Leaf: Help -->
  <rect x="1300" y="750" width="340" height="100" rx="10" fill="#e9f7f5" stroke="#157a6e" stroke-width="3"/>
  <text x="1470" y="780" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d4a42">Help text shown:</text>
  <text x="1470" y="806" text-anchor="middle" font-size="15" fill="#0d4a42">how pooling works +</text>
  <text x="1470" y="828" text-anchor="middle" font-size="15" fill="#0d4a42">local agent contact</text>

  <!-- CROP -->
  <rect x="550" y="730" width="600" height="140" rx="10" fill="#eaf4ea" stroke="#2f7a3d" stroke-width="3"/>
  <text x="850" y="760" text-anchor="middle" font-size="19" font-weight="bold" fill="#1b3a1f">Choose Crop</text>
  <text x="850" y="790" text-anchor="middle" font-size="16" fill="#1b3a1f">1. Tomatoes   2. Peppers   3. Other (type name)</text>
  <text x="850" y="816" text-anchor="middle" font-size="15" fill="#1b3a1f">(sample crop list for this concept)</text>
  <text x="850" y="844" text-anchor="middle" font-size="14" fill="#1b3a1f" font-style="italic">9. Back</text>

  <line x1="850" y1="870" x2="850" y2="908" stroke="#1b3a4b" stroke-width="2.5" marker-end="url(#u-arrow)"/>

  <!-- CRATE COUNT -->
  <rect x="550" y="910" width="600" height="120" rx="10" fill="#eaf4ea" stroke="#2f7a3d" stroke-width="3"/>
  <text x="850" y="944" text-anchor="middle" font-size="19" font-weight="bold" fill="#1b3a1f">Enter Number of Crates</text>
  <text x="850" y="972" text-anchor="middle" font-size="16" fill="#1b3a1f">Free-text entry, e.g. "45"</text>
  <text x="850" y="1000" text-anchor="middle" font-size="14" fill="#1b3a1f" font-style="italic">9. Back</text>

  <line x1="850" y1="1030" x2="850" y2="1068" stroke="#1b3a4b" stroke-width="2.5" marker-end="url(#u-arrow)"/>

  <!-- HARVEST WEEK -->
  <rect x="550" y="1070" width="600" height="140" rx="10" fill="#eaf4ea" stroke="#2f7a3d" stroke-width="3"/>
  <text x="850" y="1100" text-anchor="middle" font-size="19" font-weight="bold" fill="#1b3a1f">Choose Harvest Week</text>
  <text x="850" y="1130" text-anchor="middle" font-size="16" fill="#1b3a1f">1. This week   2. Next week</text>
  <text x="850" y="1156" text-anchor="middle" font-size="15" fill="#1b3a1f">(sample 2-option window for this concept)</text>
  <text x="850" y="1184" text-anchor="middle" font-size="14" fill="#1b3a1f" font-style="italic">9. Back</text>

  <line x1="850" y1="1210" x2="850" y2="1248" stroke="#1b3a4b" stroke-width="2.5" marker-end="url(#u-arrow)"/>

  <!-- SERVICE TYPE -->
  <rect x="550" y="1250" width="600" height="140" rx="10" fill="#eaf4ea" stroke="#2f7a3d" stroke-width="3"/>
  <text x="850" y="1280" text-anchor="middle" font-size="19" font-weight="bold" fill="#1b3a1f">Choose Service</text>
  <text x="850" y="1310" text-anchor="middle" font-size="16" fill="#1b3a1f">1. Truck pooling (share a truck)</text>
  <text x="850" y="1336" text-anchor="middle" font-size="16" fill="#1b3a1f">2. Cold room (share cold storage)</text>
  <text x="850" y="1364" text-anchor="middle" font-size="14" fill="#1b3a1f" font-style="italic">9. Back</text>

  <line x1="850" y1="1390" x2="850" y2="1428" stroke="#1b3a4b" stroke-width="2.5" marker-end="url(#u-arrow)"/>

  <!-- CONFIRMATION -->
  <rect x="520" y="1430" width="660" height="160" rx="10" fill="#fff4e0" stroke="#a66a00" stroke-width="3"/>
  <text x="850" y="1462" text-anchor="middle" font-size="19" font-weight="bold" fill="#6b4700">Review &amp; Confirm</text>
  <text x="850" y="1490" text-anchor="middle" font-size="15" fill="#6b4700">"Tomatoes, 45 crates, this week, truck pooling.</text>
  <text x="850" y="1514" text-anchor="middle" font-size="15" fill="#6b4700">Join this pool?" (sample summary text)</text>
  <text x="850" y="1542" text-anchor="middle" font-size="16" fill="#6b4700">1. Confirm   2. Cancel</text>
  <text x="850" y="1566" text-anchor="middle" font-size="14" fill="#6b4700" font-style="italic">9. Back</text>

  <line x1="850" y1="1590" x2="850" y2="1628" stroke="#1b3a4b" stroke-width="2.5" marker-end="url(#u-arrow)"/>
  <text x="862" y="1616" font-size="15" fill="#1b3a4b">if "1" Confirm</text>

  <!-- Cancel path back to main menu -->
  <path d="M 520 1500 C 300 1500, 250 700, 540 580" fill="none" stroke="#a02424" stroke-width="2.5" stroke-dasharray="8,6" marker-end="url(#u-arrow)"/>
  <text x="230" y="1050" font-size="15" fill="#a02424" transform="rotate(-90 230 1050)">if "2" Cancel → back to Main Menu</text>

  <!-- OUTCOME -->
  <rect x="520" y="1630" width="660" height="130" rx="10" fill="#eaf4ea" stroke="#2f7a3d" stroke-width="3"/>
  <text x="850" y="1662" text-anchor="middle" font-size="19" font-weight="bold" fill="#1b3a1f">USSD session ends</text>
  <text x="850" y="1690" text-anchor="middle" font-size="15" fill="#1b3a1f">SMS sent: "You've joined the tomato pool for this</text>
  <text x="850" y="1714" text-anchor="middle" font-size="15" fill="#1b3a1f">week. We'll text you when it's ready." (sample text)</text>
  <text x="850" y="1740" text-anchor="middle" font-size="15" fill="#1b3a1f">Farmer later gets quote/cost-share/receipt SMS — see sequence-diagram.md</text>

  <!-- Legend -->
  <rect x="60" y="1830" width="1580" height="130" rx="8" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/>
  <text x="80" y="1862" font-size="16" font-weight="bold" fill="#333333">Reading this diagram:</text>
  <text x="80" y="1888" font-size="16" fill="#333333">Center column = the primary "Join a Pool" path described in the product flow. Side boxes = the other three main-menu options,</text>
  <text x="80" y="1910" font-size="16" fill="#333333">shown collapsed for readability. "9. Back" returns to the previous screen; "0. Exit" ends the session. All menu text, the dial code,</text>
  <text x="80" y="1932" font-size="16" fill="#333333">and sample values (e.g. "140/200 crates") are illustrative placeholders for this idea-stage concept, not final copy or real data.</text>
</svg>
