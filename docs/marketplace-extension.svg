<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 950" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1700" height="950" fill="#ffffff"/>

  <!-- Banner -->
  <rect x="0" y="0" width="1700" height="52" fill="#b8860b"/>
  <text x="850" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">
    PROPOSED FUTURE FEATURE — NOT BUILT — ADDS TO, DOES NOT REPLACE, THE CORE DESIGN
  </text>

  <text x="850" y="90" text-anchor="middle" font-size="26" font-weight="bold" fill="#1b3a4b">
    HarvestRelay — Proposed Provider Marketplace (Web, alongside USSD)
  </text>
  <text x="850" y="115" text-anchor="middle" font-size="16" font-style="italic" fill="#555555">
    A second channel for farmers/agents and providers with smartphone or web access. The core USSD/SMS pooling flow (left) is unchanged.
  </text>

  <defs>
    <marker id="arrowFwdMk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b3a4b"/>
    </marker>
    <marker id="arrowNewMk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/>
    </marker>
  </defs>

  <text x="245" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f7a3d">EXISTING — core pooling flow</text>
  <text x="1140" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a5a00">NEW — proposed marketplace</text>

  <!-- Row 1: actors -->
  <rect x="60" y="165" width="370" height="90" rx="12" fill="#eaf4ea" stroke="#2f7a3d" stroke-width="3"/>
  <text x="245" y="198" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b3a1f">Farmer / Agent</text>
  <text x="245" y="220" text-anchor="middle" font-size="14" fill="#1b3a1f">basic phone — USSD/SMS only (no change)</text>

  <rect x="620" y="165" width="370" height="90" rx="12" fill="#fdf3e3" stroke="#b8860b" stroke-width="3" stroke-dasharray="10,6"/>
  <text x="805" y="195" text-anchor="middle" font-size="17" font-weight="bold" fill="#5c3d00">Farmer / Agent</text>
  <text x="805" y="217" text-anchor="middle" font-size="14" fill="#5c3d00">smartphone/web, logged in</text>
  <text x="805" y="236" text-anchor="middle" font-size="14" fill="#5c3d00">browses &amp; filters listings</text>

  <rect x="1050" y="165" width="590" height="90" rx="12" fill="#fdf3e3" stroke="#b8860b" stroke-width="3" stroke-dasharray="10,6"/>
  <text x="1345" y="195" text-anchor="middle" font-size="17" font-weight="bold" fill="#5c3d00">Truck owner / Cold-room operator</text>
  <text x="1345" y="217" text-anchor="middle" font-size="14" fill="#5c3d00">web, logged in — creates &amp; manages</text>
  <text x="1345" y="236" text-anchor="middle" font-size="14" fill="#5c3d00">a standing Service Listing</text>

  <line x1="245" y1="255" x2="245" y2="300" stroke="#1b3a4b" stroke-width="3" marker-end="url(#arrowFwdMk)"/>
  <line x1="805" y1="255" x2="880" y2="300" stroke="#8a5a00" stroke-width="3" marker-end="url(#arrowNewMk)"/>
  <line x1="1345" y1="255" x2="1150" y2="300" stroke="#8a5a00" stroke-width="3" marker-end="url(#arrowNewMk)"/>

  <!-- Row 2 -->
  <rect x="60" y="300" width="370" height="80" rx="12" fill="#eaf4ea" stroke="#2f7a3d" stroke-width="3"/>
  <text x="245" y="332" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b3a1f">USSD/SMS Gateway</text>
  <text x="245" y="353" text-anchor="middle" font-size="14" fill="#1b3a1f">unchanged</text>

  <rect x="620" y="300" width="1020" height="80" rx="12" fill="#fdf3e3" stroke="#b8860b" stroke-width="3" stroke-dasharray="10,6"/>
  <text x="1130" y="332" text-anchor="middle" font-size="18" font-weight="bold" fill="#5c3d00">Web Marketplace Page (NEW)</text>
  <text x="1130" y="354" text-anchor="middle" font-size="14" fill="#5c3d00">browse open listings · filter by village cluster · send a direct hire request · manage own listing</text>

  <line x1="245" y1="380" x2="500" y2="430" stroke="#1b3a4b" stroke-width="3" marker-end="url(#arrowFwdMk)"/>
  <line x1="1130" y1="380" x2="1000" y2="430" stroke="#8a5a00" stroke-width="3" marker-end="url(#arrowNewMk)"/>

  <!-- Row 3: shared API layer -->
  <rect x="60" y="430" width="1580" height="80" rx="12" fill="#eef3f7" stroke="#1b3a4b" stroke-width="3"/>
  <text x="850" y="462" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b3a4b">API Layer (same layer as the core design)</text>
  <text x="850" y="483" text-anchor="middle" font-size="14" fill="#1b3a4b">Role-based access extends to a new role: Provider-with-listing. No new backend system — one API, one set of access rules.</text>

  <line x1="440" y1="510" x2="440" y2="565" stroke="#1b3a4b" stroke-width="3" marker-end="url(#arrowFwdMk)"/>
  <line x1="1260" y1="510" x2="1260" y2="565" stroke="#8a5a00" stroke-width="3" marker-end="url(#arrowNewMk)"/>

  <!-- Row 4 -->
  <rect x="60" y="565" width="760" height="100" rx="12" fill="#eaf4ea" stroke="#2f7a3d" stroke-width="3"/>
  <text x="440" y="598" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b3a1f">Pooling Service (existing)</text>
  <text x="440" y="620" text-anchor="middle" font-size="14" fill="#1b3a1f">group by cluster+crop+week+type, watch threshold, invite quotes</text>

  <rect x="880" y="565" width="760" height="100" rx="12" fill="#fdf3e3" stroke="#b8860b" stroke-width="3" stroke-dasharray="10,6"/>
  <text x="1260" y="595" text-anchor="middle" font-size="17" font-weight="bold" fill="#5c3d00">Marketplace Logic (NEW)</text>
  <text x="1260" y="617" text-anchor="middle" font-size="14" fill="#5c3d00">ServiceListing (provider's standing offer) +</text>
  <text x="1260" y="637" text-anchor="middle" font-size="14" fill="#5c3d00">HireRequest (farmer's direct ask), filtered by cluster</text>

  <line x1="440" y1="665" x2="700" y2="725" stroke="#1b3a4b" stroke-width="3" marker-end="url(#arrowFwdMk)"/>
  <line x1="1260" y1="665" x2="1000" y2="725" stroke="#8a5a00" stroke-width="3" marker-end="url(#arrowNewMk)"/>

  <!-- Row 5: shared database -->
  <rect x="60" y="725" width="1580" height="100" rx="12" fill="#eef3f7" stroke="#1b3a4b" stroke-width="3"/>
  <text x="850" y="758" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b3a4b">Database (same database as the core design)</text>
  <text x="850" y="780" text-anchor="middle" font-size="14" fill="#1b3a4b">adds two tables: ServiceListing, HireRequest</text>
  <text x="850" y="800" text-anchor="middle" font-size="14" fill="#1b3a4b">Booking gains an optional pool_id — empty when it came from a direct hire instead of a filled pool</text>

  <text x="850" y="855" text-anchor="middle" font-size="15" fill="#1b3a1f" font-weight="bold">
    → Same downstream flow either way: Booking → Pickup → SMS Receipt
  </text>

  <text x="850" y="920" text-anchor="middle" font-size="13" fill="#777777">
    Idea-stage proposal. Thresholds, roles and field names above are illustrative, not a built schema.
  </text>
</svg>
